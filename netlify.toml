[build]
  command = "npm run build"
  publish = "dist"

# Les variables VITE_* sont PUBLIQUES par conception (intégrées au bundle frontend).
# On les exclut du scan de secrets Netlify (sinon faux positif : la valeur de
# VITE_ADMIN_EMAILS apparaît légitimement dans une migration SQL).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_EMAILS,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

# Sources autorisées pour le Netlify Image CDN (/.netlify/images)
# Couvre les sites marocains (.ma) et CDN tiers d'où proviennent les images produit.
[images]
  remote_images = [
    "^https://[a-z0-9.-]+\\.ma/.*",
    "^https://cdn\\.shopify\\.com/.*",
    "^https://produits\\.bienmanger\\.com/.*",
    "^https://storage\\.googleapis\\.com/.*",
    "^https://[a-z0-9.-]+\\.com/.*"
  ]

# ── Sécurité HTTP — appliquée à toutes les réponses ──────────────────────────
# CSP construite pour les seuls services réellement utilisés :
#  - self (bundle Vite, images proxifiées via /.netlify/images = same-origin)
#  - Supabase (REST + Auth + Realtime) : https + wss vers le projet
#  - Google Fonts (feuille de style googleapis + fichiers gstatic)
# Pas de '*' global ; pas de 'unsafe-eval'. 'unsafe-inline' conservé UNIQUEMENT pour
# style-src : le carrousel hero et Tailwind utilisent des styles inline (attribut style=).
# Aucun script inline → script-src sans 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # frame-src autorise UNIQUEMENT la barre d'outils que Netlify injecte dans les Deploy
    # Previews (app.netlify.com) — inerte en production (rien n'y est framé). La protection
    # anti-clickjacking reste assurée par frame-ancestors 'none' (qui cadre-t-NOUS).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'self' https://app.netlify.com; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://fknxppuvpdmcfhtfrjcx.supabase.co wss://fknxppuvpdmcfhtfrjcx.supabase.co; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

# Static assets — long-lived cache (JS/CSS are content-hashed by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML entry point — no cache (SPA shell must always be fresh)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
