[build]
  command = "npm run build"
  publish = "dist"

# Les variables VITE_* sont PUBLIQUES par conception (intégrées au bundle frontend).
# On les exclut du scan de secrets Netlify (sinon faux positif : la valeur de
# VITE_ADMIN_EMAILS apparaît légitimement dans une migration SQL).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_EMAILS,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

# Sources autorisées pour le Netlify Image CDN (/.netlify/images)
# Couvre les sites marocains (.ma) et CDN tiers d'où proviennent les images produit.
[images]
  remote_images = [
    "^https://[a-z0-9.-]+\\.ma/.*",
    "^https://cdn\\.shopify\\.com/.*",
    "^https://produits\\.bienmanger\\.com/.*",
    "^https://storage\\.googleapis\\.com/.*",
    "^https://[a-z0-9.-]+\\.com/.*"
  ]

# Static assets — long-lived cache (JS/CSS are content-hashed by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML entry point — no cache (SPA shell must always be fresh)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
