<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload the LCP hero image (slide 1 only) so it is discovered during HTML parse
         instead of after the JS bundle renders the <img>. imagesrcset/imagesizes match the
         <picture><source> in HeroCarousel exactly, so the fetch is reused (no double download). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/hero/slide1-900.webp 900w, /hero/slide1.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Morocco Food Export</title>
    <meta name="description" content="Catalogue export de produits alimentaires marocains — huiles, épices, dattes, fruits de mer et plus. Proforma sous 24h." />
    <meta property="og:title" content="Morocco Food Export" />
    <meta property="og:description" content="Quality from Morocco, Trusted by the World." />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
